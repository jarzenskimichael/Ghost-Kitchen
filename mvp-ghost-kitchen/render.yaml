services:
  - type: web
    name: mvp-ghost-kitchen
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mvp-ghost-kitchen-db
          property: connectionString
      - key: BUSINESS_NAME
        value: Merriman Valley Pizza
      - key: RENTAL_RATE
        value: "150"
      - key: TIMEZONE
        value: America/New_York

databases:
  - name: mvp-ghost-kitchen-db
    plan: basic-256mb
