name: Ghost Kitchen tests

on:
  push:
    branches:
      - main
      - codex/ghost-kitchen-hardening
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp-ghost-kitchen
    env:
      SECRET_KEY: test-secret-key
      ADMIN_PASSWORD: test-organizer-password
      DATABASE_URL: sqlite://
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mvp-ghost-kitchen/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
